        if(saqueJugadorIdx===0||saqueJugadorIdx===1) proximoSacadorEq[0]=(saqueJugadorIdx===0)?1:0; // Guarda quién será el próximo en sacar del Equipo 1 (el que no sacó recién)
        else if(saqueJugadorIdx===2||saqueJugadorIdx===3) proximoSacadorEq[1]=(saqueJugadorIdx===2)?3:2; // Lo mismo para el Equipo 2
        saqueJugadorIdx = (sigEq===0)?proximoSacadorEq[0]:proximoSacadorEq[1]; // Asigna el saque al jugador que le toca del equipo correspondiente
    }
    function rotarSaqueTB() { 
        if(saqueJugadorIdx < 2) { // Si sacaba el Equipo 1
            saqueJugadorIdx = proximoSacadorEq[1]; // Cambia al sacador que le toca del Equipo 2
            proximoSacadorEq[1] = (proximoSacadorEq[1] === 2) ? 3 : 2; // Prepara al otro jugador del Equipo 2 para su próximo turno
        } else { // Si sacaba el Equipo 2
            saqueJugadorIdx = proximoSacadorEq[0]; // Cambia al sacador que le toca del Equipo 1
            proximoSacadorEq[0] = (proximoSacadorEq[0] === 0) ? 1 : 0; // Prepara al otro jugador del Equipo 1 para su próximo turno
        } 
    }
    
    // --- GESTIÓN DE DATOS ---
    function deshacer() { 
        if(stack.length>0) { // Si hay algo que deshacer en el historial
            let e=JSON.parse(stack.pop()); // Recupera la última "foto" guardada
            pts=e.pts; historialSets=e.h; setActualIdx=e.sIdx; modo=e.m; saqueJugadorIdx=e.sq; proximoSacadorEq=e.pS; puntoOroActivo=e.oro; modoSTB=e.mstb; finalizado=e.f; runP=e.rP; cartelGiganteFinal = e.cg; limiteTB = e.ltb || 6; 
            startTimePartido = e.sTP || 0; acumuladoPasado = e.acP || 0; segP = e.segP || 0; // Restaura absolutamente todas las variables a ese estado anterior
            render(); // Dibuja la pantalla con los datos restaurados
        } 
    }

    function resetTotal() { if(confirm("RESET?")) { runP = false; runPel = false; localStorage.clear(); db.ref("marcador").remove().then(() => { location.reload(); }); } } // Borra todo de la memoria local, de Firebase y reinicia la aplicación
    
    function guardarLocal() { localStorage.setItem('padel_v48', JSON.stringify({ pts, historialSets, setActualIdx, modo, modoSTB, finalizado, saqueJugadorIdx, proximoSacadorEq, segP, segPel, limiteTB, puntoOroActivo, runP, startTimePartido, acumuladoPasado, names:[document.getElementById('n0').innerText,document.getElementById('n1').innerText,document.getElementById('n2').innerText,document.getElementById('n3').innerText] })); } // Guarda una copia en el navegador por si se refresca la página por error

    function cargarLocal() { 
        let b = JSON.parse(localStorage.getItem('padel_v48')); // Intenta leer la copia de seguridad
        if(b) { // Si existe, restaura los valores automáticamente
            pts=b.pts; historialSets=b.historialSets; setActualIdx=b.setActualIdx; modo=b.modo; modoSTB=b.modoSTB; finalizado=b.finalizado; saqueJugadorIdx=b.saqueJugadorIdx; proximoSacadorEq=b.proximoSacadorEq; segPel=b.segPel || 300; limiteTB=b.limiteTB || 6; puntoOroActivo=b.puntoOroActivo || false; 
            segP = b.segP || 0; runP = b.runP || false; startTimePartido = b.startTimePartido || 0; acumuladoPasado = b.acumuladoPasado || 0;
            b.names.forEach((n,i) => document.getElementById('n'+i).innerText=n); // Restaura los nombres guardados
            render(); // Actualiza la pantalla
        } 
    }

    // --- RENDERIZADO VISUAL ---
    function render() {
        const l = ["0","15","30","40","Ad"]; // Lista de etiquetas para puntos normales
        
        let pA_clean = modo==="NORMAL" ? l[pts[0]] : pts[0]; // Traduce el número interno (0,1,2,3) a puntuación de padel (0,15,30,40)
        let pB_clean = modo==="NORMAL" ? l[pts[1]] : pts[1]; // Lo mismo para el equipo B
        
        const gA = historialSets[0][setActualIdx]; // Games ganados por Equipo A en el set que se está jugando
        const gB = historialSets[1][setActualIdx]; // Games ganados por Equipo B en el set que se está jugando
        
        document.getElementById('pA').innerText = pA_clean + " (" + gA + ")"; // Actualiza el panel del Juez mostrando puntos y games entre paréntesis
        document.getElementById('pB').innerText = pB_clean + " (" + gB + ")"; // Lo mismo para el Equipo 2
        
        document.getElementById('btn-regla').innerText = `TB: ${limiteTB}-${limiteTB}`; // Actualiza el texto del botón de Tie-break
        document.getElementById('btn-regla').classList.toggle('activo', limiteTB === 5); // Cambia el color del botón si la regla está al 5-5
        document.getElementById('btn-stb').innerText = "3er SET: " + (modoSTB===0?"NORMAL":modoSTB===1?"STB(10)":"STB(11)"); // Texto del modo de 3er set
        document.getElementById('btn-stb').classList.toggle('activo', modoSTB>0); // Resalta el botón si hay SuperTB configurado
        document.getElementById('btn-oro').innerText = "ORO: " + (puntoOroActivo?"SÍ":"NO"); // Texto de Punto de Oro
        document.getElementById('btn-oro').classList.toggle('activo', puntoOroActivo); // Resalta si el Oro está activo
        
        for(let i=0; i<4; i++) document.getElementById(`f-j${i}`).classList.toggle('sirviendo', saqueJugadorIdx===i); // Enciende o apaga la luz de saque de cada jugador

        db.ref("marcador/actual").set({ // ENVÍO CRÍTICO: Envía a la pantalla gigante los datos limpios para el público
            n0: document.getElementById('n0').innerText, 
            n1: document.getElementById('n1').innerText, 
            n2: document.getElementById('n2').innerText, 
            n3: document.getElementById('n3').innerText, 
            h0: historialSets[0], // Historial de sets Equipo 1
            h1: historialSets[1], // Historial de sets Equipo 2
            p0: pA_clean, // Puntos Equipo 1 (ej: 30)
            p1: pB_clean, // Puntos Equipo 2 (ej: 15)
            sIdx: saqueJugadorIdx, // Quién saca (para mostrar la pelotita)
            modo: modo, // Si es NORMAL o TIE-BREAK
            oro: (puntoOroActivo && pts[0]===3 && pts[1]===3), // Avisa a la gigante si es Punto de Oro ahora mismo
            finalizado: finalizado, // Si el partido terminó
            msg: document.getElementById('msg-descanso').innerText // El mensaje de aviso actual (ej: CAMBIO DE LADO)
        });
    }
</script>
