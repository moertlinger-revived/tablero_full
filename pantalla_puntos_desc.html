        /* CONFIGURACIÓN ESTRUCTURAL */

            margin: 0; /* Sin márgenes externos */
            background: #000; /* Fondo negro total para resaltar en TV */
            font-family: 'Segoe UI', sans-serif; /* Fuente moderna y limpia */

            display: flex; /* Uso de flexbox para organizar el contenido */
            flex-direction: column; /* Organiza los elementos de arriba hacia abajo */

        }

        .brand-header { 
            width: 100%; /* Ancho completo */

        }
        .title-main { font-size: 20px; font-weight: 900; color: #ccff00; text-transform: uppercase; letter-spacing: 2px; } /* Estilo del texto "revived LIVE SCORE" */

        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 10px 0; } /* Contenedor central que ocupa el resto del espacio */

        /* HEADER DE ESTADO (Reloj y Avisos) */
        .header-status { width: 95%; max-width: 1200px; display: flex; align-items: center; margin-bottom: 10px; position: relative; } /* Fila superior del marcador */

        .timer-tv { 
            background: #111; /* Fondo oscuro */

            height: 65px; /* Altura fija */
            display: flex; /* Contenedor flexible */
            flex-direction: column; /* Etiqueta arriba, valor abajo */
            justify-content: center; /* Centrado vertical */
        }
        .t-label { font-size: 11px; color: #aaa; font-weight: 900; text-transform: uppercase; line-height: 1; } /* Estilo del texto "TIEMPO PARTIDO" */
        .t-val { font-size: 32px; color: #ccff00; font-family: monospace; font-weight: bold; line-height: 1; } /* Estilo del reloj digital flúor */

        .estilo-anuncio-amarillo { 
            background: #ffcc00; /* Fondo amarillo de advertencia */

            border-radius: 12px; /* Bordes redondeados */
            display: none; /* Oculto por defecto, se activa por JS */
            align-items: center; /* Centrado vertical */
            justify-content: center; /* Centrado horizontal */
            gap: 20px; /* Separación entre mensaje y segundos */
            height: 75px; /* Altura del cartel de aviso */
            padding: 0 45px; /* Espaciado lateral */
            border: 4px solid #fff; /* Borde blanco grueso */
            margin-left: 20px; /* Separación del reloj */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3), 0 0 20px rgba(255, 204, 0, 0.4); /* Sombra interna y externa */
        }
        .msg-top { font-size: 36px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; } /* Estilo del mensaje del aviso */
        .val-descanso { font-size: 48px; font-weight: 900; color: #000; font-family: 'Arial Black', sans-serif; } /* Estilo de los segundos del descanso */

        .contenedor-alertas-puntos { position: absolute; right: 0; width: 220px; display: flex; justify-content: center; align-items: center; } /* Contenedor a la derecha para ORO/TIEBREAK */
        #aviso-oro, #aviso-tiebreak-tv { 
            background: #222; /* Fondo oscuro */
            border: 2px solid #444; /* Borde gris */
            border-radius: 8px; /* Redondeado */
            height: 65px; /* Altura igual al reloj */
            display: none; /* Ocultos por defecto */
            align-items: center; /* Centrado vertical */
            justify-content: center; /* Centrado horizontal */
            font-weight: 900; /* Muy negrita */
            text-transform: uppercase; /* Mayúsculas */
            box-sizing: border-box; /* Ajuste de tamaño */
            width: 210px; /* Ancho fijo */
        }
        #aviso-oro { color: #ccff00; font-size: 32px; animation: titilar 0.6s infinite alternate; } /* Estilo Oro con animación de parpadeo */
        #aviso-tiebreak-tv { color: #ff3333; font-size: 22px; } /* Estilo Tie-break en color rojo */

        @keyframes titilar { from { opacity: 1; } to { opacity: 0.2; } } /* Definición de la animación de parpadeo */

        /* SCOREBOARD PRINCIPAL */
        #scoreboard { 
            width: 95%; /* Ancho del marcador */
            max-width: 1200px; /* Ancho máximo */
            background: #050515; /* Azul oscuro casi negro */
            border: 5px solid #333; /* Borde exterior grueso */
            border-radius: 12px; /* Esquinas redondeadas */
            overflow: hidden; /* Corta el contenido que sobresalga */
            position: relative; /* Base para el cartel de final de partido */
        }
        
        .labels-row { 
            display: flex; /* Fila de encabezados */
            background: rgba(255,255,255,0.05); /* Fondo muy ligeramente aclarado */
            font-size: 18px; /* Tamaño de letra etiquetas */
            color: #888; /* Gris para las etiquetas */
            font-weight: bold; /* Negrita */
            border-bottom: 3px solid #333; /* Línea divisoria inferior */
        }
        .label-equipo { flex-grow: 1; padding: 10px 30px; text-align: left; } /* Etiqueta "JUGADORES" */
        .label-box { width: 110px; text-align: center; padding: 10px 0; border-left: 2px solid #333; } /* Etiquetas de los SETS */

        .equipo-block { display: flex; border-bottom: 10px solid #333; height: 160px; } /* Bloque de cada pareja de jugadores */
        .equipo-block:last-child { border-bottom: none; } /* El segundo equipo no lleva borde inferior */

        .nombres-col { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; background: #db6e1a; gap: 10px; } /* Columna de nombres */
        .name-cell { font-size: 38px; font-weight: 900; text-transform: uppercase; padding-left: 30px; display: flex; align-items: center; gap: 20px; letter-spacing: -1px; } /* Fila de nombre individual */
        
        .box { width: 110px; display: flex; justify-content: center; align-items: center; font-size: 75px; font-weight: 900; border-left: 2px solid #333; background: #0a0a0a; } /* Celdas de los games ganados */
        .pts-cell { width: 220px; display: flex; justify-content: center; align-items: center; font-size: 115px; font-weight: 900; background: #c6a052; color: #000; border-left: 5px solid #333; } /* Celda de puntos actuales (Dorada) */
        .pts-cell.modo-tb { background: #111 !important; color: #c6a052 !important; font-size: 95px; } /* Inversión de colores en Tie-break para diferenciar */

        .bola { 
            width: 28px; height: 28px; /* Tamaño de la pelota de saque */
            background: #ccff00; /* Color flúor */
            border-radius: 50%; /* Forma circular */
            box-shadow: 0 0 15px #ccff00; /* Brillo exterior */
            display: none; /* Oculta por defecto */
            border: 3px solid #000; /* Borde negro para que resalte */
            margin-left: 15px; /* Separación del nombre */
        }

        /* SPONSORS */
        .footer-auspiciantes { 
            width: 100%; height: 90px; /* Altura del pie de página */
            background: #000; /* Fondo negro */
            display: flex; /* Alineación horizontal */
            justify-content: center; /* Centrado horizontal */
            align-items: center; /* Centrado vertical */
            gap: 80px; /* Espacio entre logos de patrocinadores */
            border-top: 2px solid #222; /* Línea superior */
        }
        .logo-sponsor { max-height: 80px; max-width: 200px; object-fit: contain; } /* Ajuste de imagen de patrocinadores */

        #cartel-final { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; /* Cubre todo el marcador */
            background: #000; /* Fondo negro */
            z-index: 100; /* Por encima de los puntos */
            display: none; /* Oculto por defecto */
            align-items: center; justify-content: center; /* Centrado total del mensaje */
            border: 20px solid #ccff00; /* Marco flúor de campeón */
        }
    </style>
</head>
<body>

    <div class="brand-header">
        <div class="title-main">revived <span style="color:#444">| LIVE SCORE</span></div>
        <!-- LOGO REVIVED ARRIBA -->
        <img src="https://lh3.googleusercontent.com/u/0/d/1Sbun1g6OMSdNtM-6arDu5XUxH-NbLwwP" class="logo-top">
    </div>
    
    <div class="main-content">
        <div class="header-status">
            <div class="timer-tv">
                <span class="t-label" id="timer-title">TIEMPO PARTIDO</span>
                <span class="t-val" id="val-timer">00:00:00</span> </div>
            
            <div id="aviso-tv-top" class="estilo-anuncio-amarillo">
                <span class="msg-top" id="msg-tv-desc">CAMBIO DE LADO</span> <span class="val-descanso" id="descanso-tv-q">90</span> </div>

            <div id="aviso-final-top" class="estilo-anuncio-amarillo">
                <span class="msg-top">PARTIDO FINALIZADO</span> </div>

            <div class="contenedor-alertas-puntos">
                <div id="aviso-tiebreak-tv">TIE-BREAK</div> <div id="aviso-oro">ORO</div> </div>
        </div>

        <div id="scoreboard">
            <div id="cartel-final"><div style="font-size: 100px; font-weight: 900; color: #ccff00; text-align: center;">PARTIDO<br>FINALIZADO</div></div>
            
            <div class="labels-row">
                <div class="label-equipo">JUGADORES</div>
                <div class="label-box">SET 1</div>
                <div class="label-box">SET 2</div>
                <div class="label-box">SET 3</div>
                <div class="label-box" style="width:220px; color:#c6a052;">PUNTOS</div>
            </div>
            
            <div class="equipo-block">
                <div class="nombres-col">
                    <div class="name-cell"><span id="n0">EQUIPO 1A</span><div id="b0" class="bola"></div></div> <div class="name-cell"><span id="n1">EQUIPO 1B</span><div id="b1" class="bola"></div></div> </div>
                <div class="box" id="s1-0">0</div><div class="box" id="s2-0">0</div><div class="box" id="s3-0">0</div><div class="pts-cell" id="pA">0</div> </div>

            <div class="equipo-block">
                <div class="nombres-col">
                    <div class="name-cell"><span id="n2">EQUIPO 2A</span><div id="b2" class="bola"></div></div> <div class="name-cell"><span id="n3">EQUIPO 2B</span><div id="b3" class="bola"></div></div> </div>
                <div class="box" id="s1-1">0</div><div class="box" id="s2-1">0</div><div class="box" id="s3-1">0</div><div class="pts-cell" id="pB">0</div> </div>
        </div>
    </div>


    <div class="footer-auspiciantes">
        <img src="sponsor1.png" class="logo-sponsor"> <img src="sponsor2.png" class="logo-sponsor"> <img src="sponsor3.png" class="logo-sponsor"> <img src="sponsor4.png" class="logo-sponsor"> </div>

<script>
    // --- VARIABLES DE ESTADO LOCAL ---
    let tiebreakActivo = false; // Indica si se está jugando un desempate
    let partidoFinalizadoGlobal = false; // Indica si el partido ya terminó
    
    let localRunP = false; // Estado del cronómetro de partido recibido del Juez
    let localSTP = 0; // Marca de tiempo (inicio) recibida del Juez
    let localACP = 0; // Segundos acumulados recibidos del Juez

    // --- RELOJ INTERNO (Sincronización de milisegundos) ---
    // Este reloj corre en la pantalla de TV para que el segundero sea fluido y no dependa solo de los mensajes de red
    setInterval(() => {
        if(localRunP && localSTP > 0) { // Si el juez tiene el reloj en "Play"
            let actualSeg = localACP + Math.floor((Date.now() - localSTP) / 1000); // Calcula el tiempo actual comparando la hora real con la de inicio enviada
            
            if(document.getElementById('timer-title').innerText === "TIEMPO PARTIDO") { // Solo actualiza si estamos en modo partido (no peloteo)
                let h=Math.floor(actualSeg/3600).toString().padStart(2,'0'), 
                    m=Math.floor((actualSeg%3600)/60).toString().padStart(2,'0'), 
                    s=(actualSeg%60).toString().padStart(2,'0');
                document.getElementById('val-timer').innerText = `${h}:${m}:${s}`; // Muestra el tiempo calculado en la TV
            }
        }
    }, 1000);

    // --- ACTUALIZACIÓN DE TIEMPOS Y AVISOS (Desde Firebase) ---
    function updateTiempos(t) {
        if(!t) return; // Si no hay datos, sale
        
        localRunP = t.runP; // Actualiza estado de ejecución
        localSTP = t.sTP; // Actualiza hora de inicio
        localACP = t.acP; // Actualiza segundos guardados

        if(t.vPel) { // Si el juez activó la visualización de peloteo
            document.getElementById('val-timer').innerText = t.tPel; // Muestra el reloj de peloteo (que descuenta)
            document.getElementById('timer-title').innerText = "CALENTAMIENTO";
        } else {
            document.getElementById('timer-title').innerText = "TIEMPO PARTIDO";
            if(!localRunP) document.getElementById('val-timer').innerText = t.tPar; // Si está en pausa, muestra el tiempo estático enviado
        }
        
        // Atajos para elementos de la interfaz
        const avisoTopCambio = document.getElementById('aviso-tv-top');
        const avisoFinalTop = document.getElementById('aviso-final-top');
        const cartelGigante = document.getElementById('cartel-final');
        const avisoTb = document.getElementById('aviso-tiebreak-tv');

        tiebreakActivo = t.tiebreak; // Sincroniza flag de TB
        partidoFinalizadoGlobal = t.modoFinal || t.finalizado; // Sincroniza flag de fin de partido

        if(t.cartelGigante) { // Si el juez envía la orden de mostrar el cartel de campeón grande
            cartelGigante.style.display = 'flex';
            avisoFinalTop.style.display = 'none';
            avisoTopCambio.style.display = 'none';
            avisoTb.style.display = 'none';
        } else {
            cartelGigante.style.display = 'none';
            if(partidoFinalizadoGlobal) { // Si terminó pero no hay cartel gigante (persiste el aviso arriba)
                avisoFinalTop.style.display = 'flex';
                avisoTopCambio.style.display = 'none';
                avisoTb.style.display = 'none';
            } else {
                avisoFinalTop.style.display = 'none';
                if(t.vDesc && t.tDesc > 0) { // Si hay un descanso o cambio de lado activo con tiempo
                    avisoTopCambio.style.display = 'flex'; 
                    document.getElementById('descanso-tv-q').innerText = t.tDesc; // Muestra los segundos restantes
                } else { 
                    avisoTopCambio.style.display = 'none'; 
                }
                if(tiebreakActivo) { // Si es Tie-break, muestra el cartel correspondiente
                    avisoTb.style.display = 'flex';
                    avisoTb.innerText = t.esSTB ? "SUPER TIE-BREAK" : "TIE-BREAK";
                } else {
                    avisoTb.style.display = 'none';
                }
            }
        }

        // Cambia el estilo visual de las celdas de puntos si es Tie-break
        document.getElementById('pA').classList.toggle('modo-tb', tiebreakActivo);
        document.getElementById('pB').classList.toggle('modo-tb', tiebreakActivo);
    }

    // --- ACTUALIZACIÓN DE MARCADOR Y NOMBRES (Desde Firebase) ---
    function updateActual(d) {
        if(!d) return; // Si no hay datos, sale
        // Actualiza nombres de los 4 jugadores
        document.getElementById('n0').innerText=d.n0; document.getElementById('n1').innerText=d.n1;
        document.getElementById('n2').innerText=d.n2; document.getElementById('n3').innerText=d.n3;
        // Actualiza puntos actuales (ej: 15, 30, Ad o 7 en TB)
        document.getElementById('pA').innerText=d.p0; document.getElementById('pB').innerText=d.p1;
        // Sincroniza el mensaje de texto (ej: "CAMBIO DE LADO")
        document.getElementById('msg-tv-desc').innerText = d.msg;
        
        const avisoOro = document.getElementById('aviso-oro');
        if(d.oro && !tiebreakActivo && !partidoFinalizadoGlobal) { // Muestra el cartel parpadeante solo si el Juez marca "Punto de Oro"
            avisoOro.style.display = 'flex';
        } else {
            avisoOro.style.display = 'none';
        }

        // Actualiza los games de los 3 sets para ambos equipos
        [0,1,2].forEach(i => { 
            document.getElementById(`s${i+1}-0`).innerText = d.h0[i]; 
            document.getElementById(`s${i+1}-1`).innerText = d.h1[i]; 
        });
        // Muestra u oculta la pelota de saque junto al nombre del jugador que sirve
        for(let i=0; i<4; i++) document.getElementById(`b${i}`).style.display = (d.sIdx===i) ? 'block' : 'none';
    }

    // --- ESCUCHA DE FIREBASE ---
    db.ref("marcador/tiempos").on("value", (snap) => updateTiempos(snap.val())); // Escucha cambios en cronómetros y estados de aviso
    db.ref("marcador/actual").on("value", (snap) => updateActual(snap.val())); // Escucha cambios en puntos, nombres y saque
</script>
</body>
</html>
